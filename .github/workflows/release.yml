name: Release

on:
  push:
    tags:
      - 'v*'
  pull_request:
    paths:
      - '.github/workflows/release.yml'

jobs:
  build:
    name: Build ${{ matrix.target }}
    strategy:
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-24.04
            archive: tar.gz
          - target: x86_64-apple-darwin
            os: macos-14
            archive: tar.gz
          - target: x86_64-pc-windows-msvc
            os: windows-2022
            archive: zip
    runs-on: ${{ matrix.os }}
    env:
      ARCHIVE_VERSION: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.ref_name }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - name: Build release
        run: cargo build --locked --manifest-path rust/Cargo.toml --release --package turboquant-cli --package turboquant-daemon --target ${{ matrix.target }}
      - name: Package
        shell: bash
        run: |
          cd rust/target/${{ matrix.target }}/release
          if [ "${{ matrix.os }}" = "windows-2022" ]; then
            7z a ../../../turboquant-${ARCHIVE_VERSION}-${{ matrix.target }}.zip turboquant.exe turboquant-daemon.exe
          else
            tar czf ../../../turboquant-${ARCHIVE_VERSION}-${{ matrix.target }}.tar.gz turboquant turboquant-daemon
          fi
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: turboquant-${{ matrix.target }}
          path: rust/turboquant-${{ env.ARCHIVE_VERSION }}-${{ matrix.target }}.${{ matrix.archive }}
          if-no-files-found: error

  release:
    name: Create Release
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
      - name: Generate changelog
        id: changelog
        run: |
          awk '/^## \[/{if (p) exit; p=1} p' CHANGELOG.md > release_notes.md
          echo "notes<<EOF" >> $GITHUB_OUTPUT
          cat release_notes.md >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT
      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          body_path: release_notes.md
          files: |
            turboquant-*/*
          draft: false
          prerelease: ${{ contains(github.ref, 'rc') }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
