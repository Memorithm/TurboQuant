name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  fmt:
    name: Format
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --all --manifest-path rust/Cargo.toml -- --check

  clippy:
    name: Clippy
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      # --all-features would enable turboquant-cuda's `cuda` feature, whose cudarc
      # build script requires a CUDA toolkit — absent on GitHub runners.
      - run: cargo clippy --manifest-path rust/Cargo.toml --workspace --all-targets -- -D warnings -W clippy::pedantic
      # V1 production gate: make unwrap/expect enforcement explicit instead of
      # relying on workspace-lint inheritance. Tests/examples/benches are excluded
      # so assertion-oriented test code does not weaken the public runtime gate.
      - name: Public production unwrap/expect gate
        run: cargo clippy --manifest-path rust/Cargo.toml --workspace --lib --bins -- -D warnings -D clippy::unwrap_used -D clippy::expect_used

  check:
    name: Check
    strategy:
      matrix:
        os: [ubuntu-22.04, ubuntu-24.04]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      # Note: the CPU backend is the turboquant-cpu crate (built as part
      # of the workspace); there is no `cpu` cargo feature.
      - run: cargo check --manifest-path rust/Cargo.toml --workspace

  test:
    name: Test
    strategy:
      matrix:
        os: [ubuntu-22.04, ubuntu-24.04]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo test --manifest-path rust/Cargo.toml --workspace

  doc:
    name: Docs
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo doc --manifest-path rust/Cargo.toml --workspace --no-deps
        env:
          RUSTDOCFLAGS: "-D warnings"

  msrv:
    name: MSRV (1.83)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.83
      - run: cargo check --manifest-path rust/Cargo.toml --workspace --no-default-features
        continue-on-error: true

  audit:
    name: Security Audit
    runs-on: ubuntu-24.04
    # rustsec/audit-check creates a check run with the results; without
    # checks:write the job fails on push even when the audit itself is clean.
    permissions:
      contents: read
      checks: write
    steps:
      - uses: actions/checkout@v4
      - uses: rustsec/audit-check@v2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          # The Cargo workspace (and its Cargo.lock) lives under rust/.
          working-directory: rust

  book:
    name: mdBook
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: peaceiris/actions-mdbook@v2
        with:
          mdbook-version: '0.4.44'
      - uses: dtolnay/rust-toolchain@stable
      # The book's Rust examples are compiled against the real crate:
      # build it once and point mdbook test at the rlibs.
      - run: cargo build -p turboquant-core --manifest-path rust/Cargo.toml
      - run: mdbook build rust/book
      - run: mdbook test rust/book -L rust/target/debug/deps
